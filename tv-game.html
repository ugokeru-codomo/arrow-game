<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラーアクションゲーム Pro (TV対応版)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 設定・スタート画面 --- */
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .config-group {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            width: 90%;
            max-width: 500px;
        }

        .config-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .color-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #start-btn {
            font-size: 1.5rem;
            padding: 10px 40px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        #start-btn:focus, .radio-label input:focus, input[type="color"]:focus {
            outline: 3px solid #f1c40f;
        }

        /* --- プレビューエリア --- */
        #game-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* 4分割の配置用コンテナ */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .color-area {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* 画面ごとの領域指定 */
        #area-ul { grid-area: 1 / 1 / 2 / 2; }
        #area-ur { grid-area: 1 / 2 / 2 / 3; }
        #area-dl { grid-area: 2 / 1 / 3 / 2; }
        #area-dr { grid-area: 2 / 2 / 3 / 3; }

        /* --- コントローラー（スマホ・PC操作用UI） --- */
        #controller {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            z-index: 5;
            opacity: 0.7;
        }

        .btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #btn-up { grid-area: 1 / 2 / 2 / 3; }
        #btn-left { grid-area: 2 / 1 / 3 / 2; }
        #btn-right { grid-area: 2 / 2 / 3 / 3; }
        #btn-down { grid-area: 3 / 2 / 4 / 3; }
    </style>
</head>
<body>

    <!-- 設定・スタート画面 -->
    <div id="setup-screen">
        <h1 style="margin-bottom: 20px;">カラーアクション Game</h1>
        
        <div class="config-group">
            <div class="config-title">1. 各方向の色を設定</div>
            <div class="color-grid">
                <div class="color-item">
                    <span>左上 (UL):</span>
                    <input type="color" id="picker-ul" value="#FF0000">
                </div>
                <div class="color-item">
                    <span>右上 (UR):</span>
                    <input type="color" id="picker-ur" value="#00FF00">
                </div>
                <div class="color-item">
                    <span>左下 (DL):</span>
                    <!-- 初期値をスカイブルー(#87CEEB)に変更 -->
                    <input type="color" id="picker-dl" value="#87CEEB">
                </div>
                <div class="color-item">
                    <span>右下 (DR):</span>
                    <input type="color" id="picker-dr" value="#FFFF00">
                </div>
            </div>
        </div>

        <div class="config-group">
            <div class="config-title">2. スピードを選択</div>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="speed" value="2000"> おそい</label>
                <label class="radio-label"><input type="radio" name="speed" value="1000" checked> ふつう</label>
                <label class="radio-label"><input type="radio" name="speed" value="500"> はやい</label>
            </div>
        </div>

        <button id="start-btn" tabindex="0">スタート！</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen">
        <div class="grid-container">
            <div id="area-ul" class="color-area">↖</div>
            <div id="area-ur" class="color-area">↗</div>
            <div id="area-dl" class="color-area">↙</div>
            <div id="area-dr" class="color-area">↘</div>
        </div>
    </div>

    <!-- オンスクリーン・コントローラー -->
    <div id="controller">
        <div id="btn-up" class="btn">▲</div>
        <div id="btn-left" class="btn">◀</div>
        <div id="btn-right" class="btn">▶</div>
        <div id="btn-down" class="btn">▼</div>
    </div>

    <script>
        // 設定値の保持用
        let colors = {};
        let gameInterval = null;
        let currentActiveArea = null;

        // RGBの色強度を計算して暗すぎるかチェックする関数
        function isColorTooDark(hexColor) {
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            // 輝度（明るさ）の計算式
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness < 50; // 50未満を「暗すぎる」と判定
        }

        // ゲーム開始処理
        document.getElementById('start-btn').addEventListener('click', startGame);

        function startGame() {
            // 色の取得と安全チェック
            const rawColors = {
                ul: document.getElementById('picker-ul').value,
                ur: document.getElementById('picker-ur').value,
                dl: document.getElementById('picker-dl').value,
                dr: document.getElementById('picker-dr').value
            };

            // 暗すぎる色は安全な代替色（スカイブルー等）に補正
            for (let key in rawColors) {
                if (isColorTooDark(rawColors[key])) {
                    colors[key] = '#87CEEB'; // 明るいスカイブルーに自動置換
                } else {
                    colors[key] = rawColors[key];
                }
            }

            // 初期色の適用
            document.getElementById('area-ul').style.backgroundColor = colors.ul;
            document.getElementById('area-ur').style.backgroundColor = colors.ur;
            document.getElementById('area-dl').style.backgroundColor = colors.dl;
            document.getElementById('area-dr').style.backgroundColor = colors.dr;

            // 設定画面を隠す
            document.getElementById('setup-screen').style.display = 'none';

            // スピード取得とタイマー開始
            const speed = parseInt(document.querySelector('input[name="speed"]:checked').value);
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(highlightRandomArea, speed);
        }

        // ランダムにエリアを光らせる処理
        function highlightRandomArea() {
            const areas = ['ul', 'ur', 'dl', 'dr'];
            const randomChoice = areas[Math.floor(Math.random() * areas.length)];
            
            // リセット
            areas.forEach(a => {
                document.getElementById(`area-${a}`).style.opacity = '0.3';
            });

            // 選択されたエリアを強調
            document.getElementById(`area-${randomChoice}`).style.opacity = '1.0';
            currentActiveArea = randomChoice;
        }

        // リモコン・キーボード操作対応
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    checkAnswer('ul'); // 仮の割り当て
                    break;
                case 'ArrowDown':
                    checkAnswer('dl');
                    break;
                case 'ArrowLeft':
                    checkAnswer('ul');
                    break;
                case 'ArrowRight':
                    checkAnswer('ur');
                    break;
            }
        });

        function checkAnswer(selectedArea) {
            if (selectedArea === currentActiveArea) {
                // 正解の演出など
            }
        }
    </script>
</body>
</html>
