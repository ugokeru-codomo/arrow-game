<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラーアクション設定</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #1e252b;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- 設定画面 --- */
        #setup-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #1e252b;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #273138;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #eceff1;
        }

        .card {
            background-color: #323d45;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.95rem;
            color: #b0bec5;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 4分割色調整グリッド */
        .color-setting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-setting-item {
            background-color: #273138;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .color-box-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-box-btn:active {
            transform: scale(0.95);
        }

        /* フォーム系要素 */
        select {
            width: 100%;
            padding: 10px;
            background-color: #273138;
            color: #fff;
            border: 1px solid #455a64;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
            transition: background-color 0.2s;
        }

        .start-btn:active {
            background-color: #1b5e20;
        }

        /* --- ゲーム画面 --- */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .color-area {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            transition: opacity 0.1s;
        }

        #area-ul { grid-area: 1 / 1 / 2 / 2; }
        #area-ur { grid-area: 1 / 2 / 2 / 3; }
        #area-dl { grid-area: 2 / 1 / 3 / 2; }
        #area-dr { grid-area: 2 / 2 / 3 / 3; }

        /* 色選択モーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #273138;
            width: 90%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .preset-colors {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .color-option {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .custom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .selected-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #fff;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel, .btn-set {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background: transparent;
            color: #b0bec5;
        }

        .btn-set {
            background: transparent;
            color: #4fc3f7;
        }

        #hidden-color-input {
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 設定画面 -->
    <div id="setup-screen">
        <div class="container">
            <h1>カラーアクション設定</h1>

            <div class="card">
                <div class="card-title">🎨 マットの色調整（4分割）</div>
                <div class="color-setting-grid">
                    <div class="color-setting-item">
                        <span>左上</span>
                        <div id="btn-ul" class="color-box-btn" style="background-color: #00e676;" onclick="openColorModal('ul')"></div>
                    </div>
                    <div class="color-setting-item">
                        <span>右上</span>
                        <div id="btn-ur" class="color-box-btn" style="background-color: #ffd600;" onclick="openColorModal('ur')"></div>
                    </div>
                    <div class="color-setting-item">
                        <span>左下</span>
                        <div id="btn-dl" class="color-box-btn" style="background-color: #00bfff;" onclick="openColorModal('dl')"></div>
                    </div>
                    <div class="color-setting-item">
                        <span>右下</span>
                        <div id="btn-dr" class="color-box-btn" style="background-color: #ff1744;" onclick="openColorModal('dr')"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🔊 効果音</div>
                <select id="sound-setting">
                    <option value="on">あり（サウンドON）</option>
                    <option value="off">なし（サウンドOFF）</option>
                </select>
            </div>

            <button class="start-btn" onclick="startGame()">スタート</button>
        </div>
    </div>

    <!-- 4分割ゲーム画面 -->
    <div id="game-screen">
        <div class="grid-container">
            <div id="area-ul" class="color-area">↖</div>
            <div id="area-ur" class="color-area">↗</div>
            <div id="area-dl" class="color-area">↙</div>
            <div id="area-dr" class="color-area">↘</div>
        </div>
    </div>

    <!-- 色選択モーダル -->
    <div id="color-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">色の選択</div>
            
            <div class="preset-colors">
                <div class="color-option" style="background-color: #ff1744;" onclick="selectPreset('#ff1744')"></div>
                <div class="color-option" style="background-color: #00bfff;" onclick="selectPreset('#00bfff')"></div>
                <div class="color-option" style="background-color: #2979ff;" onclick="selectPreset('#2979ff')"></div>
                <div class="color-option" style="background-color: #00e676;" onclick="selectPreset('#00e676')"></div>
                <div class="color-option" style="background-color: #d500f9;" onclick="selectPreset('#d500f9')"></div>
                <div class="color-option" style="background-color: #ffd600;" onclick="selectPreset('#ffd600')"></div>
                <div class="color-option" style="background-color: #212121;" onclick="selectPreset('#212121')"></div>
                <div class="color-option" style="background-color: #ffffff;" onclick="selectPreset('#ffffff')"></div>
            </div>

            <div class="custom-row">
                <span style="font-weight: bold; cursor: pointer;" onclick="triggerCustomPicker()">カスタム</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.9rem; color: #b0bec5;">選択した色</span>
                    <div id="modal-preview" class="selected-preview" style="background-color: #00bfff;"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeColorModal()">キャンセル</button>
                <button class="btn-set" onclick="applyColorSelection()">設定</button>
            </div>
        </div>
    </div>

    <input type="color" id="hidden-color-input" onchange="onCustomColorChange(event)">

    <script>
        let currentColors = {
            ul: '#00e676',
            ur: '#ffd600',
            dl: '#00bfff', 
            dr: '#ff1744'
        };

        let activeTarget = null;
        let tempSelectedColor = '#00bfff';
        let gameInterval = null;

        function openColorModal(target) {
            activeTarget = target;
            tempSelectedColor = currentColors[target];
            updatePreview(tempSelectedColor);
            document.getElementById('color-modal').style.display = 'flex';
        }

        function closeColorModal() {
            document.getElementById('color-modal').style.display = 'none';
        }

        function selectPreset(color) {
            tempSelectedColor = color;
            updatePreview(color);
        }

        function updatePreview(color) {
            document.getElementById('modal-preview').style.backgroundColor = color;
        }

        function applyColorSelection() {
            if (activeTarget) {
                currentColors[activeTarget] = tempSelectedColor;
                document.getElementById(`btn-${activeTarget}`).style.backgroundColor = tempSelectedColor;
            }
            closeColorModal();
        }

        function triggerCustomPicker() {
            document.getElementById('hidden-color-input').click();
        }

        function onCustomColorChange(e) {
            selectPreset(e.target.value);
        }

        // --- 本番のゲーム開始処理 ---
        function startGame() {
            // 1. 各領域に選択した色をセット
            document.getElementById('area-ul').style.backgroundColor = currentColors.ul;
            document.getElementById('area-ur').style.backgroundColor = currentColors.ur;
            document.getElementById('area-dl').style.backgroundColor = currentColors.dl;
            document.getElementById('area-dr').style.backgroundColor = currentColors.dr;

            // 2. 設定画面を隠して、ゲーム画面を表示
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            // 3. ランダム点灯処理を開始（1秒間隔）
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(highlightRandomArea, 1000);
        }

        function highlightRandomArea() {
            const areas = ['ul', 'ur', 'dl', 'dr'];
            const randomChoice = areas[Math.floor(Math.random() * areas.length)];
            
            areas.forEach(a => {
                document.getElementById(`area-${a}`).style.opacity = '0.3';
            });

            document.getElementById(`area-${randomChoice}`).style.opacity = '1.0';
        }
    </script>
</body>
</html>
